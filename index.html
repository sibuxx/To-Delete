<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">One-Step Addition or Subtraction Equations</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef7f4; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ══ TOP HEADER ══ */
.app-header {
  background: white; border-bottom: 1px solid #dde8e4;
  padding: 0 24px; height: 56px; display: flex; align-items: center;
  gap: 16px; flex-shrink: 0; z-index: 100;
}
.app-header-title { font-size: 1.1rem; font-weight: 800; color: #1a2a1e; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-header-tabs { display: none; gap: 4px; } /* hidden in normal mode */
.header-tab {
  padding: 6px 18px; border-radius: 20px; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; border: none; background: transparent; color: #666; transition: all 0.2s;
}
.header-tab.active { background: white; box-shadow: 0 1px 6px rgba(0,0,0,.15); color: #1a2a1e; }
.app-header-actions { display: flex; gap: 8px; align-items: center; }
.hdr-btn {
  padding: 6px 14px; border-radius: 8px; font-size: 0.83rem; font-weight: 700;
  cursor: pointer; border: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
}
.hdr-btn.edit-btn { background: white; color: #1a6e4a; border-color: #00a896; }
.hdr-btn.edit-btn:hover { background: #e8f9f5; }
.hdr-btn.edit-btn.active { background: #00a896; color: white; border-color: #00a896; }
.hdr-btn.new-lesson-btn { background: #1a2a38; color: white; display: none; }
.hdr-btn.new-lesson-btn:hover { background: #253848; }
.edit-mode .hdr-btn.new-lesson-btn { display: inline-block; }

/* Show Answers toggle */
.show-answers-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; padding:4px 0; }
.show-answers-wrap:hover .sa-label { color:#1a2a1e; }
.sa-track { width:38px; height:22px; background:#d0d8d4; border-radius:11px; position:relative; transition:background .2s; flex-shrink:0; }
.sa-track.on { background:#00a896; }
.sa-thumb { width:16px; height:16px; background:white; border-radius:50%; position:absolute; top:3px; left:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
.sa-track.on .sa-thumb { left:19px; }
.sa-label { font-size:0.84rem; font-weight:600; color:#666; transition:color .2s; }

/* Present button */
.hdr-btn.present-btn { background:white; color:#3a4a5a; border-color:#c0ccd4; display:flex; align-items:center; gap:6px; }
.hdr-btn.present-btn:hover { background:#f0f5f8; border-color:#8aaabb; }
.present-icon { font-size:0.95rem; }

/* Present mode */
body.present-mode { overflow:hidden; }
body.present-mode .app-header { background:#1a2a38; border-bottom-color:#2a3d50; padding:0 20px; }
body.present-mode .app-header-title { display:none; }
body.present-mode .app-header-actions { display:none; }
body.present-mode .app-header-tabs { display:flex; flex:1; justify-content:center; }
body.present-mode .header-tab { color:#aac; }
body.present-mode .header-tab.active { background:#2a3d50; color:white; box-shadow:none; }
body.present-mode .sidebar { display:none; }
body.present-mode .main-scroll { padding:32px 60px 12px; }
.present-exit-btn { display:none; background:none; border:1.5px solid #4a6070; color:#aac; border-radius:8px; padding:5px 14px; font-size:0.85rem; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; }
.present-exit-btn:hover { background:#2a3d50; color:white; }
body.present-mode .present-exit-btn { display:flex; align-items:center; gap:6px; }
.present-exit-spacer { display:none; }
body.present-mode .present-exit-spacer { display:block; width:100px; flex-shrink:0; }

/* Show-answers banner on interactive slides */
.show-answers-banner { background:#e8f4fc; border:1.5px solid #5ba4cf; border-radius:8px; padding:7px 14px; margin-bottom:14px; font-size:.82rem; color:#1a4a7a; font-weight:600; display:none; }
body.show-answers-active .show-answers-banner { display:block; }

/* ══ APP LAYOUT ══ */
.app-layout { display: flex; flex: 1; overflow: hidden; }

/* ══ SIDEBAR ══ */
.sidebar {
  width: 360px; min-width: 360px; background: white;
  border-right: 1px solid #dde8e4; display: flex; flex-direction: column;
  overflow: visible; position: relative;
  transition: width .25s ease, min-width .25s ease, padding .25s ease;
}
.sidebar.collapsed { width:0; min-width:0; border-right:0; }
.sidebar.collapsed > * { opacity:0; pointer-events:none; }
.sidebar-toggle {
  position:absolute; top:50%; right:-16px; z-index:50;
  width:30px; height:30px; border-radius:50%; background:white;
  border:1px solid #dde8e4; box-shadow:0 2px 6px rgba(0,0,0,.15);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:.8rem; color:#666; transition:all .15s;
  transform:translateY(-50%);
}
.sidebar-toggle:hover { background:#e6f7f3; color:#00a896; border-color:#00a896; }
.sidebar.collapsed .sidebar-toggle { display:none; }
/* When collapsed, show toggle on the left edge of main content */
.sidebar-toggle-collapsed {
  display:none; position:absolute; top:50%; left:0; z-index:50;
  width:28px; height:28px; border-radius:0 50% 50% 0; background:white;
  border:1px solid #dde8e4; border-left:0; box-shadow:1px 1px 4px rgba(0,0,0,.1);
  align-items:center; justify-content:center;
  cursor:pointer; font-size:.75rem; color:#888; transition:all .15s;
  transform:translateY(-50%);
}
.sidebar-toggle-collapsed:hover { background:#e6f7f3; color:#00a896; }
.sidebar.collapsed ~ .main-content .sidebar-toggle-collapsed { display:flex; }
.sidebar-header {
  background: #00a896; color: white; padding: 16px 18px; flex-shrink: 0;
}
.sidebar-header-label { font-size: 0.75rem; font-weight: 700; opacity: .75; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.sidebar-header-title { font-size: 0.98rem; font-weight: 700; line-height: 1.3; }

.slide-list { flex: 1; overflow-y: auto; padding: 12px 10px; }
.slide-list::-webkit-scrollbar { width: 4px; }
.slide-list::-webkit-scrollbar-thumb { background: #c8ddd8; border-radius: 4px; }

.slide-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border-left: 3px solid transparent; margin-bottom: 2px;
  transition: background 0.15s, border-color 0.15s; position: relative;
}
.slide-item:hover { background: #f0faf7; }
.slide-item.active { background: #e6f7f3; border-left-color: #00a896; }
.slide-item.active .slide-item-num { color: #00a896; font-weight: 800; }
.slide-item.active .slide-item-title { color: #005a4a; }

.slide-item-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
}
.slide-item-body { flex: 1; min-width: 0; }
.slide-item-num  { font-size: 0.72rem; font-weight: 700; color: #999; margin-bottom: 1px; }
.slide-item-title { font-size: 0.9rem; font-weight: 600; color: #2a3a30; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slide-item-type  { font-size: 0.75rem; color: #888; margin-top: 1px; }
.slide-item-status { flex-shrink: 0; font-size: 1rem; }

/* Edit mode slide item controls */
.slide-item-edit { display: none; gap: 2px; flex-shrink: 0; align-items: center; }
.edit-mode .slide-item:hover .slide-item-edit,
.edit-mode .slide-item.active .slide-item-edit { display: flex; }
.si-btn {
  background: none; border: none; cursor: pointer; padding: 3px 5px;
  border-radius: 5px; font-size: 0.78rem; opacity: .7; transition: all 0.15s;
  color: #555;
}
.si-btn:hover { opacity: 1; }
.si-btn.si-edit:hover { background: #d0eaf8; color: #1a5c8a; }
.si-btn.si-move { font-size: 10px; padding: 1px 4px; opacity: .4; }
.si-btn.si-move:hover { opacity: 1; background: #e6f7f3; color: #00a896; }
.si-btn.si-del:hover  { background: #fde0e0; color: #c0392b; }
.si-btn.si-hide:hover { background: #f0e8ff; color: #5a007a; }
.si-btn.si-hide { position:relative; }
.si-btn.si-hide.is-hidden::after { content:''; position:absolute; top:45%; left:15%; width:70%; height:2px; background:#c0392b; transform:rotate(-45deg); border-radius:1px; }
.slide-item.hidden-slide { opacity: .45; cursor: default; }
.slide-item.hidden-slide .slide-item-title { text-decoration: line-through; }

/* Insert strip between slides (edit mode) */
.insert-item { display: none; justify-content: center; padding: 0 12px; }
.edit-mode .insert-item { display: flex; }
.insert-btn {
  font-size: 0.7rem; color: #aaa; background: none; border: none;
  padding: 0; cursor: pointer; font-weight: 600; width: 100%;
  transition: color 0.15s;
}
.insert-btn:hover { color: #00a896; }

.sidebar-footer { padding: 10px; border-top: 1px solid #e8f0ec; flex-shrink: 0; }
.add-slide-card {
  display: none; align-items: center; gap: 10px; background: #fffbe6;
  border: 1.5px solid #ffc107; border-radius: 10px; padding: 10px 12px; cursor: pointer;
  transition: background 0.15s;
}
.edit-mode .add-slide-card { display: flex; }
.add-slide-card:hover { background: #fff8d0; }
.add-slide-card-icon { width: 32px; height: 32px; background: #ffc107; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.add-slide-card-text { flex: 1; font-size: 0.85rem; font-weight: 700; color: #7a5a00; }
.add-slide-card-text span { display: block; font-weight: 400; font-size: 0.76rem; color: #a07000; }
.add-slide-plus { background: #ffc107; color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* ══ MAIN CONTENT ══ */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.main-scroll { flex: 1; overflow-y: auto; padding: 28px 40px 12px; }
.main-scroll::-webkit-scrollbar { width: 6px; }
.main-scroll::-webkit-scrollbar-thumb { background: #c8ddd8; border-radius: 4px; }

.slide { display: none; }
.slide.active { display: block; }

/* Type badge chip */
.type-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: #e6f7f3; color: #007a6a; border: 1.5px solid #b0e4d8;
  border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; font-weight: 700;
  margin-bottom: 18px;
}

/* ══ TOKI AI HELPER ══ */
.toki-btn {
  position: absolute; top: -18px; right: -18px; z-index: 10;
  width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
  background: #4ecdc0; box-shadow: 0 3px 12px rgba(0,0,0,.18);
  padding: 0; display: flex; align-items: center; justify-content: center;
  transition: transform .2s, box-shadow .2s;
}
.toki-btn:hover { transform: scale(1.12); box-shadow: 0 5px 18px rgba(0,0,0,.25); }
.toki-btn:active { transform: scale(1.05); }
.present-mode .toki-btn { display: none; }

/* ══ CARD ══ */
.card { background: white; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07); padding: 28px; margin-bottom: 20px; transition: box-shadow .3s, border .3s; border: 2px solid transparent; position: relative; overflow: visible; }
.card.ai-changed { border-color: #f59e0b; box-shadow: 0 0 16px rgba(245,158,11,.25); position: relative; }
.card.ai-changed::before { content:'✨ AI Changed — Review & Accept or Discard'; position:absolute; top:-14px; left:20px; background:#f59e0b; color:#fff; font-size:.75rem; font-weight:700; padding:2px 12px; border-radius:8px; z-index:2; }
.slide-title { font-size: 1.5rem; font-weight: 700; color: #1a2a1e; margin-bottom: 8px; }
.slide-subtitle { color: #777; font-size: 0.95rem; margin-bottom: 18px; }

/* ══ BOTTOM NAV ══ */
.main-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 40px; border-top: 1px solid #dde8e4; background: white; flex-shrink: 0;
}
.nav-prev, .nav-next {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 24px; border-radius: 24px; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; border: none; transition: all 0.2s;
}
.nav-prev { background: #e8ede9; color: #444; }
.nav-prev:hover { background: #d8e4da; }
.nav-next { background: #00a896; color: white; }
.nav-next:hover:not(:disabled) { background: #008a7c; }
.nav-next:disabled { background: #b0d4cf; cursor: not-allowed; }
.nav-counter { font-size: 0.88rem; color: #888; font-weight: 600; }

/* ══ TABS ══ */
.tabs { display: flex; border-bottom: 2px solid #e8ede9; flex-wrap: wrap; margin-bottom: 0; }
.tab-btn { padding: 10px 18px; border: none; background: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: #777; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; flex: 1; text-align: center; }
.tab-btn.active { color: #00a896; border-bottom-color: #00a896; background: #f0faf7; }
.tab-btn:hover { background: #f5f5f5; }
.tab-panel { display: none; padding: 20px; }
.tab-panel.active { display: block; }

/* ══ EQUATIONS ══ */
.eq-box { background: #f8f8f8; border: 1px solid #e8ede9; border-radius: 10px; padding: 14px 20px; text-align: center; font-size: 1.25rem; margin: 10px auto; max-width: 320px; font-style: italic; }
.eq-highlight { color: #e05a2b; font-style: italic; }
.math { font-style: italic; }

/* ══ FORMULA TABLE ══ */
.formula-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.97rem; }
.formula-table td { border: 1px solid #dde8e4; padding: 9px 14px; }
.formula-table td:first-child { font-style: italic; font-weight: 600; background: #f8fbf9; }
.formula-table td:last-child { color: #555; }

/* ══ MCQ ══ */
.mcq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
.mcq-option { display: flex; align-items: flex-start; gap: 14px; background: white; border: 1.5px solid #dde8e4; border-radius: 12px; padding: 14px 16px; cursor: pointer; font-size: 0.97rem; transition: all 0.2s; }
.mcq-option:hover:not(.locked) { border-color: #00a896; background: #f0faf7; }
.mcq-option.selected { border-color: #3e8aee; background: #f0f7ff; }
.mcq-option.correct  { border-color: #2ecc9a; background: #e6f9f2; }
.mcq-option.wrong    { border-color: #e05a5a; background: #fdf0f0; }
.mcq-option.locked   { cursor: default; }
.radio-circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all 0.2s; }
.radio-circle.checked       { border-color: #3e8aee; background: #3e8aee; }
.radio-circle.correct-check { border-color: #2ecc9a; background: #2ecc9a; }
.radio-circle.wrong-x       { border-color: #e05a5a; background: #e05a5a; }
.radio-circle.checked::after, .radio-circle.correct-check::after { content:''; width:8px; height:8px; border-radius:50%; background:white; }
.radio-circle.wrong-x::after { content:'✕'; color:white; font-size:11px; line-height:1; }

/* ══ MATCH ══ */
.match-cols { display: flex; align-items: stretch; position: relative; }
.match-col { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.match-col-header { font-size: 0.8rem; font-weight: 700; color: #999; text-align: center; padding-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.match-item { background: #f0faf7; border-radius: 10px; padding: 10px 14px; font-size: 0.95rem; font-style: italic; font-weight: 500; text-align: center; border: 2px solid #b0ddd0; cursor: pointer; transition: all 0.15s; user-select: none; }
.match-item:hover:not(.locked) { border-color: #00a896; }
.match-item.selected { outline: 3px solid #1a2a1e; outline-offset: 1px; }
.match-item.pair-0 { background: #e8f4ff; border-color: #3e8aee; color: #1a4a8a; }
.match-item.pair-1 { background: #fff3e0; border-color: #ff9800; color: #7a3e00; }
.match-item.pair-2 { background: #f3e5f5; border-color: #9c27b0; color: #4a0070; }
.match-item.pair-3 { background: #e0f7fa; border-color: #00bcd4; color: #004d60; }
.match-item.pair-4 { background: #fce4ec; border-color: #e91e63; color: #7a0030; }
.match-item.correct { border-color: #2ecc9a !important; background: #e6f9f2 !important; }
.match-item.wrong   { border-color: #e05a5a !important; background: #fdf0f0 !important; }
.match-item.locked  { cursor: default; }
.match-svg-overlay  { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible; }

/* ══ DROPDOWN ══ */
.sentence-line { margin: 10px 0; font-size: 1.02rem; line-height: 2.2; }
.answer-wrap { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; }
select.answer-select { font-size:0.95rem; font-family:inherit; font-style:italic; border:2px solid #b0ddd0; border-radius:8px; padding:4px 8px; background:#f0faf7; cursor:pointer; outline:none; transition:all 0.2s; min-width:90px; }
select.answer-select:focus { border-color: #00a896; }
select.answer-select.feedback-correct { border-color:#2ecc9a; background:#e6f9f2; }
select.answer-select.feedback-wrong   { border-color:#e05a5a; background:#fdf0f0; }
select.answer-select:disabled { cursor:default; opacity:.85; }
.feedback-icon { font-size: 1rem; }

/* ══ BADGES ══ */
.correct-badge { background:#e6f9f2; border:2px solid #2ecc9a; border-radius:10px; padding:10px 18px; color:#1a7a3a; font-weight:700; display:inline-flex; align-items:center; gap:8px; margin:14px 0; }
.wrong-msg { background:#fdf0f0; border:2px solid #e05a5a; border-radius:10px; padding:10px 18px; color:#7a1a1a; font-weight:600; display:inline-flex; align-items:center; gap:8px; margin:14px 0; font-size:.93rem; }
.note-box { background:#fff8e1; border-left:4px solid #ffc107; border-radius:4px; padding:10px 14px; margin:10px 0; color:#7a5500; font-size:.92rem; }

/* ══ CHECK BTN ══ */
.check-btn { background:#00a896; color:white; border:none; border-radius:10px; padding:10px 24px; font-size:.95rem; font-weight:700; cursor:pointer; margin-top:14px; transition:background 0.2s; }
.check-btn:hover:not(:disabled) { background:#008a7c; }
.check-btn:disabled { opacity:.5; cursor:not-allowed; }

/* ══ INTRO CARD ══ */
.intro-card { display:grid; grid-template-columns:1fr 1fr; border-radius:14px; overflow:hidden; min-height:420px; }
.intro-card-img { display:flex; align-items:center; justify-content:center; font-size:4rem; padding:40px; }
.intro-card-text { display:flex; align-items:center; justify-content:center; padding:48px 40px; }
.intro-title { font-size:2.4rem; font-weight:800; color:#1a3a5c; line-height:1.25; text-align:center; }

/* ══ VIDEO ══ */
.video-placeholder { background:#1a1a1a; border-radius:12px; padding:60px 20px; text-align:center; color:#888; font-size:1rem; margin:10px 0; }
.video-placeholder .play-btn { width:70px; height:70px; background:rgba(255,255,255,.85); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; cursor:pointer; }
.video-placeholder .play-btn::after { content:''; width:0; height:0; border-top:16px solid transparent; border-bottom:16px solid transparent; border-left:26px solid #333; margin-left:5px; }

/* ══ MISC ══ */
.property-desc { margin-bottom:10px; color:#555; line-height:1.6; }
h3 { font-size:1rem; color:#1a2a1e; margin:10px 0 4px; }
p  { line-height:1.6; margin:4px 0; }

/* ══ MODIFIED SLIDE BANNER ══ */
.modified-banner {
  display:flex; align-items:center; gap:10px;
  background:#fff8e1; border:1.5px solid #ffc107; border-radius:10px;
  padding:10px 14px; margin-bottom:18px; font-size:.87rem; color:#7a5a00;
}
.modified-banner-text { flex:1; font-weight:600; }
.modified-banner-text span { display:block; font-size:.78rem; font-weight:400; color:#a07000; margin-top:1px; }
.modified-revert-btn {
  background:white; border:1.5px solid #ffc107; border-radius:7px;
  padding:5px 12px; font-size:.82rem; font-weight:700; color:#7a5a00;
  cursor:pointer; white-space:nowrap; transition:background .15s;
}
.modified-revert-btn:hover { background:#fff0a0; }

/* Modified dot in sidebar */
.si-modified-dot {
  width:8px; height:8px; border-radius:50%; background:#ffc107;
  flex-shrink:0; margin-left:2px; display:none; title:'Modified';
}
.si-modified-dot.visible { display:block; }

/* ══ RIGHT EDIT PANEL ══ */
.edit-panel {
  width:0; min-width:0; overflow:hidden;
  background:white; display:flex; flex-direction:column;
  border-left:0 solid transparent;
  transition:width .25s ease, min-width .25s ease, border-left .25s ease;
}
.edit-panel.open {
  width:360px; min-width:360px;
  border-left:1px solid #dde8e4;
}
.ep-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; border-bottom:1px solid #e8f0ec; flex-shrink:0;
  background:#f8fbf9;
}

let currentSlide = 0;
let editModeActive = true;
let SLIDE_STATE = {};
let SLIDE_HISTORY = {};
let LESSON_HISTORY = null;
let editTargetSlide = null;
let editInsertAfter = null;
let pendingSlideEdit = null; // { isInsert, targetSlide, insertAfter, data }
let editPromptCache = {}; // per-slide prompt text cache

// ══════════════════════════════════════════════════════════════
// SECTION 3 — SLIDE STATE HELPERS
// ══════════════════════════════════════════════════════════════
function initSlideState(i) {
  const t = SLIDES[i] && SLIDES[i].type;
  if (t === 'dropdown-practice') SLIDE_STATE[i] = { passed:false };
  else if (t === 'drag-match')   SLIDE_STATE[i] = { passed:false, userPairs:{}, selectedEq:null, shuffledSolutions:null };
  else if (t === 'multiple-choice') SLIDE_STATE[i] = { passed:false, selectedIndex:null, checked:false };
  else delete SLIDE_STATE[i];
}
function resetSlideState(i) { initSlideState(i); }
function canAdvance(i) { if (showAnswersMode) return true; const s = SLIDE_STATE[i]; return !s || s.passed; }
function unlockNext(i) { if (SLIDE_STATE[i]) SLIDE_STATE[i].passed = true; updateMainNav(); updateSidebarItem(i); }

function shiftStateKeys(from, delta) {
  const ns = {}, nh = {};
  Object.entries(SLIDE_STATE).forEach(([k,v]) => { const i=parseInt(k); ns[i>=from?i+delta:i]=v; });
  Object.entries(SLIDE_HISTORY).forEach(([k,v]) => { const i=parseInt(k); nh[i>=from?i+delta:i]=v; });
  SLIDE_STATE = ns; SLIDE_HISTORY = nh;
}

// ══════════════════════════════════════════════════════════════
// SECTION 4 — DOM BUILDING
// ══════════════════════════════════════════════════════════════
function buildAllDOM() {
  buildSlideCards();
  buildSidebar();
  updateMainNav();
}

function buildSlideCards() {
  const container = document.getElementById('lessonContainer');
  container.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === currentSlide ? ' active' : '');
    div.id = 'slide-' + i;
    div.innerHTML = '<div class="card"></div>';
    container.appendChild(div);
    renderSlide(i);
  });
}

function buildSidebar() {
  const list = document.getElementById('slideList');
  list.innerHTML = '';

  SLIDES.forEach((s, i) => {
    // Insert strip before each slide (edit mode)
    const strip = document.createElement('div');
    strip.className = 'insert-item';
    strip.id = 'ins-' + i;
    strip.innerHTML = `<button class="insert-btn" onclick="openInsertModal(${i-1})">+ Insert slide here</button>`;
    list.appendChild(strip);

    const meta = TYPE_META[s.type] || { label:'Slide', icon:'📄', bg:'#eee', color:'#555' };
    const isActive = i === currentSlide;
    const passed = canAdvance(i) && SLIDE_STATE[i] !== undefined;
    const hasUndo = !!SLIDE_HISTORY[i];
    const isEditable = Object.keys(SCHEMAS).includes(s.type);

    const isHidden = !!s._hidden;
    const item = document.createElement('div');
    item.className = 'slide-item' + (isActive ? ' active' : '') + (isHidden ? ' hidden-slide' : '');
    item.id = 'si-' + i;
    item.onclick = () => { if(!s._hidden) goToSlide(i); };
    item.innerHTML = `
      <div class="slide-item-icon" style="background:${meta.bg};color:${meta.color}">${meta.icon}</div>
      <div class="slide-item-body">
        <div class="slide-item-num" style="display:flex;align-items:center;gap:5px">Slide ${i+1}${hasUndo?'<span style="background:#ffc107;color:#7a5000;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:8px;letter-spacing:.3px">MODIFIED</span>':''}${isHidden?'<span style="background:#e0e0e0;color:#888;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:8px">HIDDEN</span>':''}</div>
        <div class="slide-item-title">${s.title || meta.label}</div>
        <div class="slide-item-type">${meta.label}</div>
      </div>
      <div class="slide-item-edit">
        ${!isHidden && i > 0 ? `<button class="si-btn si-move" title="Move up" onclick="event.stopPropagation();moveSlide(${i},-1)">▲</button>` : ''}
        ${!isHidden && i < SLIDES.length-1 ? `<button class="si-btn si-move" title="Move down" onclick="event.stopPropagation();moveSlide(${i},1)">▼</button>` : ''}
        ${!isHidden && isEditable ? `<button class="si-btn si-edit" title="Edit with Toki AI" onclick="event.stopPropagation();openEditModal(${i})">✏</button>` : ''}
        <button class="si-btn si-hide ${isHidden?'is-hidden':''}" title="${isHidden?'Show':'Hide'} slide" onclick="event.stopPropagation();toggleHideSlide(${i})">👁</button>
        ${!isHidden && SLIDES.length > 1 ? `<button class="si-btn si-del" title="Delete slide" onclick="event.stopPropagation();deleteSlide(${i})">🗑</button>` : ''}
        ${!isHidden && hasUndo ? `<button class="si-btn" title="Revert to original" onclick="event.stopPropagation();undoSlideEdit(${i})" style="color:#e05a2b">↩ Revert</button>` : ''}
      </div>
      <div class="slide-item-status">${passed && SLIDE_STATE[i] ? '✅' : ''}</div>
    `;
    list.appendChild(item);
  });

  // Update titles
  document.getElementById('sidebarTitle').textContent = LESSON_TITLE;
  document.getElementById('lessonHeaderTitle').textContent = LESSON_TITLE;
  document.getElementById('pageTitle').textContent = LESSON_TITLE;
}

function updateSidebarItem(i) {
  // Rebuild just that item
  buildSidebar();
}

// ══════════════════════════════════════════════════════════════
// SECTION 5 — NAVIGATION
// ══════════════════════════════════════════════════════════════
function goToSlide(n) {
  document.getElementById('slide-' + currentSlide).classList.remove('active');
  const prevSI = document.getElementById('si-' + currentSlide);
  if (prevSI) prevSI.classList.remove('active');

  currentSlide = n;
  document.getElementById('slide-' + n).classList.add('active');
  const nextSI = document.getElementById('si-' + n);
  if (nextSI) { nextSI.classList.add('active'); nextSI.scrollIntoView({ block:'nearest', behavior:'smooth' }); }

  document.getElementById('mainScroll').scrollTop = 0;
  updateMainNav();

  // If edit panel is open and we navigated to a different slide, re-open for the new slide
  if (document.getElementById('editPanel').classList.contains('open') && editTargetSlide !== null && editTargetSlide !== n) {
    const isEditable = Object.keys(SCHEMAS).includes(SLIDES[n].type);
    if (isEditable && !SLIDES[n]._hidden) {
      // Save current prompt text for the old slide
      editPromptCache[editTargetSlide] = document.getElementById('editPromptArea').value;
      // Show Toki on old slide, open panel for new slide
      const oldToki = document.querySelector('#slide-'+editTargetSlide+' .toki-btn');
      if(oldToki) oldToki.style.display='';
      editTargetSlide = n;
      panelOriginalSlide = JSON.parse(JSON.stringify(SLIDES[n]));
      panelInsertedIdx = null;
      document.getElementById('epTitle').innerHTML=`<img src="${TOKI_IMG}" alt="Toki" style="width:28px;height:28px;border-radius:50%;flex-shrink:0"> Edit Slide ${n+1}`;
      // Restore saved prompt or clear
      document.getElementById('editPromptArea').value = editPromptCache[n] || '';
      document.getElementById('editStatus').style.display='none';
      document.getElementById('editGenerateBtn').disabled=false;
      document.getElementById('editGenerateBtn').textContent='Generate ›';
      document.getElementById('epBody').style.display='';
      document.getElementById('epActions').style.display='none';
      populateHints('edit');
      const newToki = document.querySelector('#slide-'+n+' .toki-btn');
      if(newToki) newToki.style.display='none';
    } else {
      // Save prompt before closing
      editPromptCache[editTargetSlide] = document.getElementById('editPromptArea').value;
      closeEditPanel();
    }
  }
}

function updateMainNav() {
  const visible = SLIDES.map((s,j)=>({idx:j,hidden:!!s._hidden})).filter(s=>!s.hidden);
  const visNum  = visible.findIndex(v=>v.idx===currentSlide) + 1;
  const visTotal = visible.length;
  const isLast  = visible.length > 0 && visible[visible.length-1].idx === currentSlide;
  const isFirst = visible.length > 0 && visible[0].idx === currentSlide;

  document.getElementById('navCounter').textContent = `Slide ${visNum || (currentSlide+1)} of ${visTotal}`;
  document.getElementById('navPrev').disabled = isFirst;
  const nextBtn = document.getElementById('navNext');
  if (isLast) {
    nextBtn.textContent = '↩ Restart';
    nextBtn.disabled = false;
    nextBtn.onclick = () => goToSlide(visible[0].idx);
  } else {
    nextBtn.textContent = 'Next ›';
    nextBtn.disabled = !canAdvance(currentSlide);
    nextBtn.onclick = () => navNext();
  }
}

function navBack() {
  for (let j = currentSlide - 1; j >= 0; j--) { if (!SLIDES[j]._hidden) { goToSlide(j); return; } }
}
function navNext() {
  if (!canAdvance(currentSlide)) {
    const btn = document.getElementById('navNext');
    btn.style.transform = 'translateX(6px)'; setTimeout(()=>btn.style.transform='',300);
    return;
  }
  for (let j = currentSlide + 1; j < SLIDES.length; j++) { if (!SLIDES[j]._hidden) { goToSlide(j); return; } }
}

// ══════════════════════════════════════════════════════════════
// SECTION 6 — TAB SWITCHER
// ══════════════════════════════════════════════════════════════
function switchTab(sn, tn) {
  document.querySelectorAll('#tabs-'+sn+' .tab-btn').forEach((t,i)=>t.classList.toggle('active',i===tn));
  document.querySelectorAll('[id^="tab-'+sn+'-"]').forEach((p,i)=>p.classList.toggle('active',i===tn));
}

function renderPresentationTabs(d,idx) {
  const btns=d.tabs.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" onclick="switchTab(${idx},${i})">${t.label}</button>`).join('');
  const panels=d.tabs.map((t,i)=>`<div class="tab-panel${i===0?' active':''}" id="tab-${idx}-${i}"><p class="property-desc">${t.description||''}</p>${(t.equations||[]).map(e=>`<div class="eq-box"><span class="math">${processEq(e)}</span></div>`).join('')}</div>`).join('');
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div>${d.subtitle?`<div class="slide-subtitle">${d.subtitle}</div>`:''}<div class="tabs" id="tabs-${idx}">${btns}</div>${panels}`;
}
function renderVideo(d) {
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div><div class="video-placeholder"><div class="play-btn"></div><p>Animated lesson video (${d.duration})<br><span style="font-size:.85rem">${d.description}</span></p></div><div class="note-box"><strong>Note:</strong> ${d.note}</div>`;
}
function renderWorkedExampleTabs(d,idx) {
  const btns=d.tabs.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" onclick="switchTab(${idx},${i})">${t.label}</button>`).join('');
  const panels=d.tabs.map((t,i)=>`<div class="tab-panel${i===0?' active':''}" id="tab-${idx}-${i}"><h3>${t.heading}</h3>${(t.paragraphs||[]).map(p=>`<p class="math" style="margin:6px 0">${p}</p>`).join('')}</div>`).join('');
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div><div class="tabs" id="tabs-${idx}">${btns}</div>${panels}`;
}
function renderDropdownPractice(d,idx) {
  const rows=d.sentences.map(s=>{
    const opts=shuffle([...s.options],s.id).map(o=>`<option value="${escHtml(o)}">${escHtml(o)}</option>`).join('');
    return `<div class="sentence-line">${s.before?s.before+' ':''}<span class="answer-wrap"><select class="answer-select" id="sel-${idx}-${s.id}"><option value="">— select —</option>${opts}</select><span class="feedback-icon" id="fi-${idx}-${s.id}"></span></span>${s.after?' '+s.after:''}</div>`;
  }).join('');
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div><p style="color:#777;font-size:.9rem;margin-bottom:6px">${d.subtitle}</p><p style="font-size:1.1rem;font-weight:700;margin-bottom:10px">${d.prompt}</p><p style="color:#005a8a;font-weight:600;margin-bottom:14px">${d.instruction}</p>${rows}<div style="margin-top:16px"><button class="check-btn" id="checkBtn-${idx}" onclick="checkDropdown(${idx})">Check Answer</button></div><div id="dropResult-${idx}" style="margin-top:10px"></div>`;
}
function renderSteppedTable(d) {
  const secs=d.sections.map(s=>`<p style="font-weight:700;margin:14px 0 6px">${s.heading}</p><table class="formula-table"><tbody>${s.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`).join('');
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div><p style="margin-bottom:14px">${d.intro}</p>${secs}`;
}
function renderDragMatch(d,idx) {
  if(!SLIDE_STATE[idx]) SLIDE_STATE[idx]={passed:false,userPairs:{},selectedEq:null,shuffledSolutions:null};
  const st=SLIDE_STATE[idx];
  if(!st.shuffledSolutions) st.shuffledSolutions=shuffle(d.pairs.map((_,i)=>i),'match'+idx);
  const eqItems=d.pairs.map((p,i)=>`<div class="match-item" id="eq-${idx}-${i}" onclick="matchClickEq(${idx},${i})">${p.equation}</div>`).join('');
  const solItems=st.shuffledSolutions.map(si=>`<div class="match-item" id="sol-${idx}-${si}" onclick="matchClickSol(${idx},${si})">${d.pairs[si].solution}</div>`).join('');
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div><div class="slide-subtitle">${d.subtitle}</div><p style="color:#005a8a;font-weight:600;margin-bottom:14px">${d.instruction}</p><div class="match-cols" id="matchCols-${idx}"><div class="match-col"><div class="match-col-header">Equation</div>${eqItems}</div><svg class="match-svg-overlay" id="matchSvg-${idx}"></svg><div class="match-col"><div class="match-col-header">Solution</div>${solItems}</div></div><div style="margin-top:16px"><button class="check-btn" id="matchCheckBtn-${idx}" onclick="checkMatch(${idx})" disabled>Check Matches</button></div><div id="matchResult-${idx}" style="margin-top:10px"></div>`;
}
function renderMultipleChoice(d,idx) {
  const opts=d.options.map((o,i)=>`<div class="mcq-option" id="mcq-${idx}-${i}" onclick="selectMCQ(${idx},${i})"><div class="radio-circle" id="rc-${idx}-${i}"></div><div>${o.lines.map(l=>`<p>${l}</p>`).join('')}</div></div>`).join('');
  return `${typeBadge(d.type)}<div class="slide-title">${d.title}</div><p style="font-size:1.05rem;font-weight:700;margin-bottom:14px">${d.question}</p><p style="color:#005a8a;font-weight:600;margin-bottom:10px">${d.instruction}</p><div class="mcq-grid">${opts}</div><button class="check-btn" id="mcqCheckBtn-${idx}" onclick="checkMCQ(${idx})" disabled>Check Answer</button><div id="mcqResult-${idx}" style="margin-top:10px"></div>`;
}
function renderSummary(d,idx) {
  return `<div style="text-align:center;padding:20px 0"><div style="font-size:3rem;margin-bottom:16px">${d.emoji}</div><div class="slide-title">${d.title}</div><p style="margin:12px 0 24px;color:#666">${d.subtitle}</p><div style="background:#f0faf7;border-radius:12px;padding:20px;text-align:left;max-width:480px;margin:0 auto"><p style="font-weight:700;margin-bottom:10px;color:#005a4a">Key Takeaways:</p><ul style="padding-left:20px;line-height:1.9;color:#444">${d.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div></div>`;
}

function renderSlide(i) {
  const d=SLIDES[i], fn=RENDERERS[d.type]; if(!fn) return;
  const card = document.querySelector('#slide-'+i+' .card');
  card.innerHTML = fn(d,i);
  // Add Toki AI helper button on editable, visible slides (hide if edit panel is open for this slide)
  const isEditable = Object.keys(SCHEMAS).includes(d.type);
  if (isEditable && editTargetSlide !== i && !d._hidden) {
    const existing = card.querySelector('.toki-btn');
    if (!existing) {
      const btn = document.createElement('button');
      btn.className = 'toki-btn';
      btn.title = 'Edit with Toki AI';
      btn.innerHTML = `<img src="${TOKI_IMG}" alt="Toki" style="width:100%;height:100%;border-radius:50%">`;
      btn.onclick = function(e) { e.stopPropagation(); openEditModal(i); };
      card.appendChild(btn);
    }
  }
  if (['dropdown-practice','drag-match','multiple-choice'].includes(d.type)) {
    injectShowAnswersBanner(i);
    if (showAnswersMode) revealSlideAnswers(i);
  }
}

function checkDropdown(idx) {
  const d=SLIDES[idx]; let ok=true;
  d.sentences.forEach(s=>{
    const sel=document.getElementById('sel-'+idx+'-'+s.id);
    const fi=document.getElementById('fi-'+idx+'-'+s.id);
    if(!sel) return;
    sel.classList.remove('feedback-correct','feedback-wrong');
    if(!sel.value){ok=false;fi.textContent='';return;}
    if(sel.value===s.correct){sel.classList.add('feedback-correct');sel.disabled=true;fi.textContent='✓';fi.style.color='#2ecc9a';}
    else{sel.classList.add('feedback-wrong');fi.textContent='✗';fi.style.color='#e05a5a';ok=false;}
  });
  const res=document.getElementById('dropResult-'+idx);
  if(ok){res.innerHTML='<div class="correct-badge">✓ Well done! All correct.</div>';document.getElementById('checkBtn-'+idx).disabled=true;unlockNext(idx);}
  else{res.innerHTML='<div class="wrong-msg">✗ Fix the highlighted answers and try again.</div>';}
}

function matchClickEq(idx,eqIdx) {
  const st=SLIDE_STATE[idx]; if(!st||st.passed) return;
  if(st.userPairs[eqIdx]!==undefined){unpairEq(idx,eqIdx);return;}
  if(st.selectedEq!==null){const p=document.getElementById('eq-'+idx+'-'+st.selectedEq);if(p)p.classList.remove('selected');}
  st.selectedEq=eqIdx; document.getElementById('eq-'+idx+'-'+eqIdx).classList.add('selected');
}
function matchClickSol(idx,solIdx) {
  const st=SLIDE_STATE[idx]; if(!st||st.passed) return;
  if(st.selectedEq===null){const ex=Object.keys(st.userPairs).find(k=>st.userPairs[k]===solIdx);if(ex!==undefined)unpairEq(idx,parseInt(ex));return;}
  const eqIdx=st.selectedEq;
  const exEq=Object.keys(st.userPairs).find(k=>st.userPairs[k]===solIdx);
  if(exEq!==undefined)unpairEq(idx,parseInt(exEq));
  const pc=Object.keys(st.userPairs).length;
  st.userPairs[eqIdx]=solIdx;
  const eqEl=document.getElementById('eq-'+idx+'-'+eqIdx),sEl=document.getElementById('sol-'+idx+'-'+solIdx);
  if(eqEl){eqEl.classList.remove('selected');eqEl.className='match-item pair-'+pc;eqEl.dataset.pair=pc;}
  if(sEl){sEl.className='match-item pair-'+pc;sEl.dataset.pair=pc;}
  st.selectedEq=null;drawMatchConnectors(idx);
  const btn=document.getElementById('matchCheckBtn-'+idx);
  if(btn)btn.disabled=Object.keys(st.userPairs).length<SLIDES[idx].pairs.length;
}
function unpairEq(idx,eqIdx) {
  const st=SLIDE_STATE[idx];const solIdx=st.userPairs[eqIdx];delete st.userPairs[eqIdx];
  const eqEl=document.getElementById('eq-'+idx+'-'+eqIdx),sEl=document.getElementById('sol-'+idx+'-'+solIdx);
  if(eqEl)eqEl.className='match-item'; if(sEl)sEl.className='match-item';
  st.selectedEq=null;drawMatchConnectors(idx);
  const btn=document.getElementById('matchCheckBtn-'+idx);
  if(btn)btn.disabled=Object.keys(st.userPairs).length<SLIDES[idx].pairs.length;
}
function drawMatchConnectors(idx) {
  const svg=document.getElementById('matchSvg-'+idx),cont=document.getElementById('matchCols-'+idx);
  if(!svg||!cont)return; svg.innerHTML='';
  const cr=cont.getBoundingClientRect(),st=SLIDE_STATE[idx];if(!st)return;
  const colors=['#3e8aee','#ff9800','#9c27b0','#00bcd4','#e91e63'];
  Object.entries(st.userPairs).forEach(([eqIdx,solIdx])=>{
    const eqEl=document.getElementById('eq-'+idx+'-'+eqIdx),sEl=document.getElementById('sol-'+idx+'-'+solIdx);
    if(!eqEl||!sEl)return;
    const er=eqEl.getBoundingClientRect(),sr=sEl.getBoundingClientRect();
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',er.right-cr.left);line.setAttribute('y1',er.top+er.height/2-cr.top);
    line.setAttribute('x2',sr.left-cr.left);line.setAttribute('y2',sr.top+sr.height/2-cr.top);
    line.setAttribute('stroke',colors[eqEl.dataset.pair]||'#aaa');line.setAttribute('stroke-width','2.5');line.setAttribute('stroke-dasharray','6,3');
    svg.appendChild(line);
  });
}
function checkMatch(idx) {
  const st=SLIDE_STATE[idx]; let allOk=true;
  Object.entries(st.userPairs).forEach(([eqIdx,solIdx])=>{
    const ok=parseInt(eqIdx)===parseInt(solIdx);
    const eqEl=document.getElementById('eq-'+idx+'-'+eqIdx),sEl=document.getElementById('sol-'+idx+'-'+solIdx);
    const cls=ok?'correct':'wrong';
    if(eqEl){eqEl.classList.add(cls,'locked');eqEl.onclick=null;}
    if(sEl){sEl.classList.add(cls,'locked');sEl.onclick=null;}
    if(!ok)allOk=false;
  });
  const res=document.getElementById('matchResult-'+idx);
  if(allOk){res.innerHTML='<div class="correct-badge">✓ All matches correct! Well done.</div>';document.getElementById('matchCheckBtn-'+idx).disabled=true;unlockNext(idx);}
  else{
    res.innerHTML='<div class="wrong-msg">✗ Some pairs are wrong (red). Click a wrong item to unpair and retry.</div>';
    Object.entries(st.userPairs).forEach(([eqIdx,solIdx])=>{
      const eqEl=document.getElementById('eq-'+idx+'-'+eqIdx),sEl=document.getElementById('sol-'+idx+'-'+solIdx);
      if(eqEl&&eqEl.classList.contains('wrong')){eqEl.classList.remove('locked');eqEl.onclick=()=>matchClickEq(idx,parseInt(eqIdx));}
      if(sEl&&sEl.classList.contains('wrong')){sEl.classList.remove('locked');sEl.onclick=()=>matchClickSol(idx,parseInt(solIdx));}
    });
  }
}
function selectMCQ(idx,optIdx) {
  const st=SLIDE_STATE[idx];if(!st||st.checked)return;
  st.selectedIndex=optIdx;
  SLIDES[idx].options.forEach((_,i)=>{
    const opt=document.getElementById('mcq-'+idx+'-'+i),rc=document.getElementById('rc-'+idx+'-'+i);
    if(opt)opt.classList.toggle('selected',i===optIdx);
    if(rc)rc.className='radio-circle'+(i===optIdx?' checked':'');
  });
  document.getElementById('mcqCheckBtn-'+idx).disabled=false;
}
function checkMCQ(idx) {
  const st=SLIDE_STATE[idx],d=SLIDES[idx];if(st.selectedIndex===null)return;
  const ok=st.selectedIndex===d.correctIndex;
  const res=document.getElementById('mcqResult-'+idx);
  if(ok){
    st.checked=true;
    d.options.forEach((_,i)=>{
      const opt=document.getElementById('mcq-'+idx+'-'+i),rc=document.getElementById('rc-'+idx+'-'+i);
      if(!opt||!rc)return;
      opt.classList.add('locked');opt.onclick=null;opt.classList.remove('selected');
      if(i===d.correctIndex){opt.classList.add('correct');rc.className='radio-circle correct-check';}
      else rc.className='radio-circle';
    });
    res.innerHTML='<div class="correct-badge">✓ Correct! Well done.</div>';
    document.getElementById('mcqCheckBtn-'+idx).disabled=true;
    unlockNext(idx);
  } else {
    // Wrong — highlight selected red, let student try again
    d.options.forEach((_,i)=>{
      const opt=document.getElementById('mcq-'+idx+'-'+i),rc=document.getElementById('rc-'+idx+'-'+i);
      if(!opt||!rc)return;
      if(i===st.selectedIndex){opt.classList.add('wrong');rc.className='radio-circle wrong-x';}
    });
    res.innerHTML='<div class="wrong-msg">✗ Incorrect — try again.</div>';
    // Reset so student can re-select after a moment
    setTimeout(()=>{
      const opt=document.getElementById('mcq-'+idx+'-'+st.selectedIndex);
      const rc=document.getElementById('rc-'+idx+'-'+st.selectedIndex);
      if(opt){opt.classList.remove('wrong','selected');}
      if(rc){rc.className='radio-circle';}
      st.selectedIndex=null;
      document.getElementById('mcqCheckBtn-'+idx).disabled=true;
      res.innerHTML='<div class="wrong-msg">✗ Incorrect — select another answer.</div>';
    },1200);
  }
}

function undoSlideEdit(i) {
  const prev=SLIDE_HISTORY[i]; if(!prev)return;
  delete SLIDE_HISTORY[i]; resetSlideState(i); SLIDES[i]=prev;
  renderSlide(i); updateModifiedBanner(i); buildSidebar(); updateMainNav();
}

function applySlideEdit(i,newData) {
  if(!SLIDE_HISTORY[i]) SLIDE_HISTORY[i]=JSON.parse(JSON.stringify(SLIDES[i]));
  resetSlideState(i); SLIDES[i]=newData;
  renderSlide(i); updateModifiedBanner(i); buildSidebar(); updateMainNav();
  goToSlide(i); // navigate to the modified slide
}

function updateModifiedBanner(i) {
  const card=document.querySelector('#slide-'+i+' .card'); if(!card)return;
  const existing=card.querySelector('.modified-banner'); if(existing)existing.remove();
  if(SLIDE_HISTORY[i]) {
    const banner=document.createElement('div');
    banner.className='modified-banner';
    banner.innerHTML=`<span class="modified-banner-text">⚠ Teacher-modified slide<span>This slide has been edited and differs from the original</span></span><button class="modified-revert-btn" onclick="undoSlideEdit(${i})">↩ Revert to original</button>`;
    card.insertBefore(banner,card.firstChild);
  }
}

function insertSlideAt(afterIdx,newData) {
  const pos=afterIdx+1;
  shiftStateKeys(pos,+1);
  SLIDES.splice(pos,0,newData);
  initSlideState(pos);
  if(currentSlide>=pos)currentSlide++;
  buildAllDOM(); goToSlide(pos);
}

function toggleHideSlide(i) {
  SLIDES[i]._hidden = !SLIDES[i]._hidden;
  // If currently viewing a hidden slide, jump to next visible
  if (SLIDES[i]._hidden && currentSlide === i) {
    const next = nextVisibleSlide(i);
    if (next !== -1) goToSlide(next);
  }
  // Update the slide div visibility
  const el = document.getElementById('slide-' + i);
  if (el) el.style.display = SLIDES[i]._hidden ? 'none' : '';
  buildSidebar(); updateMainNav();
}

function nextVisibleSlide(from) {
  for (let j = from + 1; j < SLIDES.length; j++) if (!SLIDES[j]._hidden) return j;
  for (let j = from - 1; j >= 0; j--) if (!SLIDES[j]._hidden) return j;
  return from; // fallback if all hidden
}

function moveSlide(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= SLIDES.length) return;
  // Swap slides
  [SLIDES[i], SLIDES[j]] = [SLIDES[j], SLIDES[i]];
  // Swap state and history
  const tmpState = SLIDE_STATE[i]; SLIDE_STATE[i] = SLIDE_STATE[j]; SLIDE_STATE[j] = tmpState;
  const tmpHist = SLIDE_HISTORY[i]; SLIDE_HISTORY[i] = SLIDE_HISTORY[j]; SLIDE_HISTORY[j] = tmpHist;
  // Follow the moved slide
  if (currentSlide === i) currentSlide = j;
  else if (currentSlide === j) currentSlide = i;
  buildAllDOM(); goToSlide(currentSlide);
}

function deleteSlide(i) {
  if(SLIDES.length<=1)return;
  const title=SLIDES[i].title||SLIDES[i].type;
  if(!confirm(`Delete slide ${i+1} "${title}"?`))return;
  shiftStateKeys(i+1,-1);delete SLIDE_STATE[i];delete SLIDE_HISTORY[i];
  SLIDES.splice(i,1);
  if(currentSlide>=SLIDES.length)currentSlide=SLIDES.length-1;
  buildAllDOM(); goToSlide(currentSlide);
}

function undoNewLesson() {
  if(!LESSON_HISTORY)return;
  SLIDES=LESSON_HISTORY.slides; LESSON_TITLE=LESSON_HISTORY.title;
  LESSON_HISTORY=null; SLIDE_STATE={}; SLIDE_HISTORY={};
  SLIDES.forEach((_,i)=>initSlideState(i)); currentSlide=0;
  buildAllDOM();
}

async function runSlideGenerate() {
  const apiKey=getApiKey();
  if(!apiKey){showPanelStatus('Please enter your Gemini API key.','error');return;}
  const prompt=document.getElementById('editPromptArea').value.trim();
  if(!prompt){showPanelStatus('Please describe the slide content.','error');return;}
  const btn=document.getElementById('editGenerateBtn');
  btn.disabled=true; btn.textContent='Generating…';
  const forced=editTargetSlide!==null&&SLIDES[editTargetSlide]?SLIDES[editTargetSlide].type:'';
  const current=editTargetSlide!==null?SLIDES[editTargetSlide]:null;
  const sys=buildSlideSystemPrompt(forced,current);
  const usr=editTargetSlide!==null
    ?`Teacher instruction: "${prompt}"\nUse template: ${forced}`
    :`Create a new slide: "${prompt}"${forced?'\nUse template: '+forced:'\nChoose the best template.'}`;
  try {
    const json=await callGemini(apiKey,sys,usr,s=>showPanelStatus(s,'loading'));
    const v=validateSlide(json);
    if(v.error){showPanelStatus('Error: '+v.error,'error');btn.disabled=false;btn.textContent='Generate ›';return;}
    // Apply directly to the slide
    if(editTargetSlide!==null) {
      if(!SLIDE_HISTORY[editTargetSlide]) SLIDE_HISTORY[editTargetSlide]=panelOriginalSlide;
      resetSlideState(editTargetSlide); SLIDES[editTargetSlide]=v.data;
      renderSlide(editTargetSlide); updateModifiedBanner(editTargetSlide);
      buildSidebar(); updateMainNav();
      goToSlide(editTargetSlide);
    } else {
      const pos=editInsertAfter+1;
      insertSlideAt(editInsertAfter,v.data);
      panelInsertedIdx=pos;
      editTargetSlide=pos; // switch to edit mode on the new slide
    }
    // Highlight the changed slide
    const changedCard = document.querySelectorAll('.slide')[editTargetSlide]?.querySelector('.card');
    if(changedCard) changedCard.classList.add('ai-changed');
    // Show accept/discard alongside prompt (keep prompt visible for iteration)
    btn.disabled=false; btn.textContent='Generate ›';
    document.getElementById('epActions').style.display='';
    document.getElementById('editStatus').style.display='none';
  } catch(e){showPanelStatus('Error: '+e.message,'error');}
  finally { btn.disabled=false; btn.textContent='Generate ›'; }
}

function acceptPanelEdit() {
  document.querySelectorAll('.card.ai-changed').forEach(c=>c.classList.remove('ai-changed'));
  if(editTargetSlide!==null) delete editPromptCache[editTargetSlide];
  panelOriginalSlide=null; panelInsertedIdx=null;
  closeEditPanel();
}

function discardPanelEdit() {
  document.querySelectorAll('.card.ai-changed').forEach(c=>c.classList.remove('ai-changed'));
  if(panelInsertedIdx!==null) {
    // Undo insert
    shiftStateKeys(panelInsertedIdx+1,-1); delete SLIDE_STATE[panelInsertedIdx]; delete SLIDE_HISTORY[panelInsertedIdx];
    SLIDES.splice(panelInsertedIdx,1);
    if(currentSlide>=SLIDES.length) currentSlide=SLIDES.length-1;
    buildAllDOM(); goToSlide(currentSlide);
    panelInsertedIdx=null;
  } else if(editTargetSlide!==null && panelOriginalSlide) {
    // Revert edit
    delete SLIDE_HISTORY[editTargetSlide];
    resetSlideState(editTargetSlide); SLIDES[editTargetSlide]=panelOriginalSlide;
    renderSlide(editTargetSlide); updateModifiedBanner(editTargetSlide);
    buildSidebar(); updateMainNav();
  }
  // Return to prompt mode so user can modify and regenerate
  panelOriginalSlide = editTargetSlide!==null ? JSON.parse(JSON.stringify(SLIDES[editTargetSlide])) : null;
  const epBody = document.getElementById('epBody');
  const epActions = document.getElementById('epActions');
  const genBtn = document.getElementById('editGenerateBtn');
  epBody.style.display = '';
  epActions.style.display = 'none';
  genBtn.disabled = false;
  genBtn.textContent = 'Generate ›';
  document.getElementById('editStatus').style.display = 'none';
}

}

- Return only the JSON object.`;
}

// ══════════════════════════════════════════════════════════════
// SECTION 12 — AI & UTILITIES
// ══════════════════════════════════════════════════════════════
async function callGemini(apiKey,sys,usr,onStatus) {
  const MODELS=['gemini-2.5-flash','gemini-2.5-flash-preview-04-17','gemini-2.5-pro','gemini-2.0-flash','gemini-2.0-flash-lite'];
  const body={systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:usr}]}],generationConfig:{responseMimeType:'application/json',temperature:0.4,maxOutputTokens:4096}};
  for(const model of MODELS){
    if(onStatus)onStatus('⏳ Trying '+model+'…');
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    let res;
    try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
    catch(e){throw new Error('Network error — check your connection.');}
    if(res.status===404)continue;
    if((res.status===429||res.status===503)&&model!==MODELS[MODELS.length-1]){if(onStatus)onStatus('⏳ '+model+' rate-limited, trying next…');await new Promise(r=>setTimeout(r,5000));continue;}
    if(!res.ok){const m={400:'Bad request — check your prompt.',403:'Invalid API key.',429:'Rate limit. Wait 30s.',503:'Service unavailable.'};throw new Error(m[res.status]||'HTTP '+res.status);}
    const data=await res.json();
    const text=data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text)throw new Error('Empty response from Gemini.');
    return JSON.parse(text);
  }
  throw new Error('No models responded. Wait 30 seconds and retry.');
}

function validateSlide(json) {
  if(typeof json!=='object'||!json)return{error:'Not a JSON object.'};
  const all=[...Object.keys(SCHEMAS),'intro','video','summary'];
  if(!json.type||!all.includes(json.type))return{error:`Unknown type "${json.type}".`};
  const req={'presentation-tabs':['title','tabs'],'worked-example-tabs':['title','tabs'],'dropdown-practice':['title','sentences'],'stepped-table':['title','sections'],'drag-match':['title','pairs'],'multiple-choice':['title','question','options','correctIndex'],'intro':['title'],'summary':['title','takeaways']};
  const missing=(req[json.type]||[]).filter(f=>!(f in json));
  if(missing.length)return{error:`Missing for ${json.type}: ${missing.join(', ')}`};
  if(json.type==='multiple-choice'&&(!Array.isArray(json.options)||json.options.length!==4))return{error:'multiple-choice needs exactly 4 options.'};
  return{data:json};
}

function shuffle(arr,seed){const a=[...arr];let h=0;for(let i=0;i<String(seed).length;i++)h=Math.imul(31,h)+String(seed).charCodeAt(i)|0;const rand=()=>{h^=h<<13;h^=h>>17;h^=h<<5;return(h>>>0)/0x100000000;};for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let showAnswersMode = false;

function toggleShowAnswers() {
  showAnswersMode = !showAnswersMode;
  document.getElementById('saTrack').classList.toggle('on', showAnswersMode);
  document.body.classList.toggle('show-answers-active', showAnswersMode);
  SLIDES.forEach((d, i) => {
    if (['dropdown-practice','drag-match','multiple-choice'].includes(d.type)) {
      renderSlide(i);
      updateModifiedBanner(i);
      if (showAnswersMode) revealSlideAnswers(i);
    }
  });
  updateMainNav();
}

function revealSlideAnswers(i) {
  const d = SLIDES[i];
  if (d.type === 'dropdown-practice') {
    d.sentences.forEach(s => {
      const sel = document.getElementById('sel-'+i+'-'+s.id);
      const fi  = document.getElementById('fi-'+i+'-'+s.id);
      if (!sel) return;
      sel.value = s.correct; sel.classList.add('feedback-correct'); sel.disabled = true;
      if (fi) { fi.textContent = '✓'; fi.style.color = '#2ecc9a'; }
    });
    const cb = document.getElementById('checkBtn-'+i); if (cb) cb.style.display='none';
    const r  = document.getElementById('dropResult-'+i); if (r) r.innerHTML='';
  }
  if (d.type === 'multiple-choice') {
    d.options.forEach((_, j) => {
      const opt = document.getElementById('mcq-'+i+'-'+j);
      const rc  = document.getElementById('rc-'+i+'-'+j);
      if (!opt || !rc) return;
      opt.classList.add('locked'); opt.onclick = null; opt.classList.remove('selected');
      if (j === d.correctIndex) { opt.classList.add('correct'); rc.className='radio-circle correct-check'; }
      else rc.className='radio-circle';
    });
    const cb = document.getElementById('mcqCheckBtn-'+i); if (cb) cb.style.display='none';
    const r  = document.getElementById('mcqResult-'+i);   if (r) r.innerHTML='';
  }
  if (d.type === 'drag-match') {
    const st = SLIDE_STATE[i];
    if (!st) return;
    // Clear existing pairs, show correct ones
    d.pairs.forEach((_, j) => {
      st.userPairs[j] = j;
      const eqEl  = document.getElementById('eq-'+i+'-'+j);
      const solEl = document.getElementById('sol-'+i+'-'+j);
      if (eqEl)  { eqEl.className  = 'match-item pair-'+j+' locked'; eqEl.onclick  = null; }
      if (solEl) { solEl.className = 'match-item pair-'+j+' locked'; solEl.onclick = null; }
    });
    drawMatchConnectors(i);
    const cb = document.getElementById('matchCheckBtn-'+i); if (cb) cb.style.display='none';
    const r  = document.getElementById('matchResult-'+i);   if (r) r.innerHTML='';
  }
}

// Inject show-answers banner into interactive slide cards
function injectShowAnswersBanner(i) {
  const card = document.querySelector('#slide-'+i+' .card'); if (!card) return;
  if (card.querySelector('.show-answers-banner')) return;
  const banner = document.createElement('div');
  banner.className = 'show-answers-banner';
  banner.textContent = '👁 Teacher preview — answers are visible. Students see this as an interactive question.';
  card.insertBefore(banner, card.firstChild);
}

}

function exitPresentMode() {

// SECTION 14 — ANALYTICS
// ══════════════════════════════════════════════════════════════
function switchMainTab(tab) {
  const isLesson = tab === 'lesson';
  document.getElementById('tabLesson').classList.toggle('active', isLesson);
  document.getElementById('tabAnalytics').classList.toggle('active', !isLesson);
  document.querySelector('.app-layout').style.display = isLesson ? 'flex' : 'none';
  const av = document.getElementById('analyticsView');
  if (isLesson) { av.classList.remove('active'); }
  else { av.classList.add('active'); renderAnalytics(); }
}

function renderAnalytics() {
  const S = MOCK_STUDENTS;
  const total = SLIDES.length;

  // ── Overall stats ──
  const completed  = S.filter(s => s.reached >= total).length;
  const inProgress = S.filter(s => s.reached > 0 && s.reached < total).length;
  const notStarted = S.filter(s => s.reached === 0).length;
  const avgPct = Math.round(S.reduce((a,s)=>a+s.reached,0) / S.length / total * 100);

  // ── Find interactive slide indices dynamically ──
  const ddIdx  = SLIDES.findIndex(s => s.type === 'dropdown-practice');
  const matchIdx = SLIDES.findIndex(s => s.type === 'drag-match');
  const mcqIdx = SLIDES.findIndex(s => s.type === 'multiple-choice');

  // ── Dropdown analysis ──
  const ddStudents = S.filter(s => s.qDropdown);
  const ddN = ddStudents.length;
  const ddSentences = ddIdx >= 0 ? SLIDES[ddIdx].sentences : [];
  const ddSentHTML = ddSentences.map(sent => {
    const wrongCount = ddStudents.filter(s => s.qDropdown.wrongFirst.includes(sent.id)).length;
    const correctPct = ddN ? Math.round((ddN - wrongCount) / ddN * 100) : 0;
    const barClass = correctPct >= 75 ? 'good' : correctPct >= 50 ? 'mid' : 'poor';
    const preview = (sent.before||'') + ' ___ ' + (sent.after||'');
    return `<div class="an-sent-row">
      <div class="an-sent-label">"${preview.trim()}"  ·  Correct answer: <strong>${sent.correct}</strong></div>
      <div class="an-sent-bar-wrap">
        <div class="an-sent-bar-track"><div class="an-sent-bar-fill ${barClass}" style="width:${correctPct}%"></div></div>
        <span class="an-sent-pct" style="color:${barClass==='good'?'#1a7a3a':barClass==='mid'?'#7a5a00':'#c0392b'}">${correctPct}%</span>
      </div>
      <div class="an-sent-note">${correctPct}% correct on first attempt · ${wrongCount} student${wrongCount!==1?'s':''} chose a wrong answer initially</div>
    </div>`;
  }).join('');
  const ddAttempts = [1,2,3].map(n => {
    const c = ddStudents.filter(s => s.qDropdown.attempts === n).length;
    return c > 0 ? `<span class="an-attempt-pill a${n}">${n === 3 ? '3+' : n} attempt${n>1?'s':''}: ${c} student${c!==1?'s':''}</span>` : '';
  }).join('');

  // ── Match analysis ──
  const matchStudents = S.filter(s => s.qMatch);
  const matchN = matchStudents.length;
  const matchAttempts = [1,2,3].map(n => {
    const c = matchStudents.filter(s => s.qMatch.attempts === n).length;
    return c > 0 ? `<span class="an-attempt-pill a${n}">${n === 3 ? '3+' : n} attempt${n>1?'s':''}: ${c} student${c!==1?'s':''}</span>` : '';
  }).join('');
  const matchAvgAttempts = matchN ? (matchStudents.reduce((a,s)=>a+s.qMatch.attempts,0)/matchN).toFixed(1) : '-';

  // ── MCQ analysis ──
  const mcqStudents = S.filter(s => s.qMCQ);
  const mcqN = mcqStudents.length;
  const mcqData = mcqIdx >= 0 ? SLIDES[mcqIdx] : null;
  const mcqCorrectIdx = mcqData ? mcqData.correctIndex : 0;
  const mcqOptHTML = mcqData ? mcqData.options.map((opt, i) => {
    const count = mcqStudents.filter(s => s.qMCQ.first === i).length;
    const pct = mcqN ? Math.round(count / mcqN * 100) : 0;
    const isCorrect = i === mcqCorrectIdx;
    const letter = String.fromCharCode(65 + i);
    return `<div class="an-opt-row">
      <span class="an-opt-label" style="color:${isCorrect?'#1a7a3a':'#888'}">${letter}</span>
      <div class="an-opt-text">${opt.lines[0]}</div>
      <div class="an-opt-bar-track"><div class="an-opt-bar-fill ${isCorrect?'correct':'wrong'}" style="width:${pct}%"></div></div>
      <span class="an-opt-count">${count} student${count!==1?'s':''} · ${pct}%</span>
      ${isCorrect ? '<span class="an-opt-correct-tag">✓ Correct</span>' : ''}
    </div>`;
  }).join('') : '';
  const mcqFirstCorrect = mcqStudents.filter(s => s.qMCQ.first === mcqCorrectIdx).length;

  // ── Students table ──
  const studentRowsHTML = [...S].sort((a,b) => b.reached - a.reached).map(s => {
    const pct = Math.round(s.reached / total * 100);
    const status = s.reached >= total ? 'completed' : s.reached > 0 ? 'in-progress' : 'not-started';
    const badge  = s.reached >= total ? 'Completed' : s.reached > 0 ? `Slide ${s.reached}/${total}` : 'Not Started';
    const dot = (q, label) => {
      if (!q) return `<div class="an-dot na" title="${label}: not reached">—</div>`;
      return `<div class="an-dot pass" title="${label}: passed">✓</div>`;
    };
    return `<div class="an-student-row">
      <div class="an-avatar" style="background:${s.color}">${s.initials}</div>
      <div class="an-name">${s.name}</div>
      <div class="an-q-dots" title="Q1=Dropdown, Q2=Match, Q3=MCQ">
        ${dot(s.qDropdown,'Q1 Dropdown')}${dot(s.qMatch,'Q2 Match')}${dot(s.qMCQ,'Q3 MCQ')}
      </div>
      <div class="an-progress-wrap">
        <div class="an-progress-track"><div class="an-progress-fill" style="width:${pct}%"></div></div>
        <span class="an-progress-label">${badge}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('analyticsView').innerHTML = `
    <div class="an-card">
      <div class="an-lesson-title">${LESSON_TITLE}</div>
      <div class="an-stats-row">
        <span class="an-stat completed">✓ ${completed} Completed</span>
        <span class="an-stat-sep">|</span>
        <span class="an-stat in-progress">↗ ${inProgress} In Progress</span>
        <span class="an-stat-sep">|</span>
        <span class="an-stat not-started">○ ${notStarted} Not Started</span>
      </div>
      <div class="an-class-bar-label">Class average progress — ${avgPct}%</div>
      <div class="an-class-bar-track"><div class="an-class-bar-fill" style="width:${avgPct}%"></div></div>
    </div>

    ${ddIdx >= 0 ? `<div class="an-card">
      <div class="an-q-header">
        <div class="an-q-icon" style="background:#ffecd0;color:#8a4a00">🎯</div>
        <div><div class="an-q-title">${SLIDES[ddIdx].title}</div><div class="an-q-slide">Slide ${ddIdx+1} · Dropdown Fill-in</div></div>
      </div>
      <div class="an-q-meta"><strong>${ddN}</strong> of ${S.length} students attempted this question</div>
      ${ddSentHTML}
      <div class="an-attempts">${ddAttempts}</div>
    </div>` : ''}

    ${matchIdx >= 0 ? `<div class="an-card">
      <div class="an-q-header">
        <div class="an-q-icon" style="background:#f0e0ff;color:#5a007a">🔗</div>
        <div><div class="an-q-title">${SLIDES[matchIdx].title}</div><div class="an-q-slide">Slide ${matchIdx+1} · Click-to-Match</div></div>
      </div>
      <div class="an-q-meta"><strong>${matchN}</strong> of ${S.length} students attempted · Average <strong>${matchAvgAttempts}</strong> check attempts before passing</div>
      <div class="an-attempts">${matchAttempts}</div>
    </div>` : ''}

    ${mcqIdx >= 0 && mcqData ? `<div class="an-card">
      <div class="an-q-header">
        <div class="an-q-icon" style="background:#fce4ec;color:#880e4f">❓</div>
        <div><div class="an-q-title">${mcqData.title}</div><div class="an-q-slide">Slide ${mcqIdx+1} · Multiple Choice</div></div>
      </div>
      <div class="an-q-meta"><strong>${mcqN}</strong> of ${S.length} students attempted · <strong>${mcqFirstCorrect}/${mcqN}</strong> (${mcqN?Math.round(mcqFirstCorrect/mcqN*100):0}%) correct on first selection</div>
      <p style="font-size:.85rem;font-weight:700;color:#444;margin-bottom:10px">${mcqData.question}</p>
      ${mcqOptHTML}
    </div>` : ''}

    <div class="an-card">
      <div class="an-section-title">All Students <span style="font-weight:400;color:#888;font-size:.85rem">· Q1 = Dropdown, Q2 = Match, Q3 = MCQ</span></div>
      ${studentRowsHTML}
    </div>
  `;
}
